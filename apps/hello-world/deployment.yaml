apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world-app
  template:
    metadata:
      labels:
        app: hello-world-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "app"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/hello-world/my-secret"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/hello-world/my-secret" -}}
            export USERNAME="{{ .Data.data.username }}" 
            export PASSWORD="{{ .Data.data.password }}"
          {{- end -}}
    spec:
      serviceAccountName: app
      containers:
        - name: hello-world-app
          image: docker.io/kicbase/echo-server:1.0
          args:  ['sh', '-c', 'source /vault/secrets/config && /bin/echo-server --port=8080']
          ports:
            - containerPort: 8080