apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-external-access
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  sources:
    - repoURL: https://github.com/TechTalk-With-Nathan/gitops-argocd-hello-world.git
      targetRevision: vault-manual-unseal
      path: apps/vault-external-access
      kustomize: {} 

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true